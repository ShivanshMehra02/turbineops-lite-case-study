type Turbine {
  id: ID!
  name: String!
  manufacturer: String
  mwRating: Float
  lat: Float
  lng: Float
  createdAt: String!
  updatedAt: String!
  inspections: [Inspection!]!
}

type TurbineConnection {
  items: [Turbine!]!
  totalCount: Int!
  page: Int!
  limit: Int!
}

input TurbineCreateInput {
  name: String!
  manufacturer: String
  mwRating: Float
  lat: Float
  lng: Float
}

input TurbineUpdateInput {
  name: String
  manufacturer: String
  mwRating: Float
  lat: Float
  lng: Float
}

enum DataSource {
  DRONE
  MANUAL
}

type Inspection {
  id: ID!
  date: String!
  inspectorName: String
  dataSource: DataSource!
  rawPackageUrl: String
  turbine: Turbine!
  findings: [Finding!]!
  repairPlan: RepairPlan
}

enum FindingCategory {
  BLADE_DAMAGE
  LIGHTNING
  EROSION
  UNKNOWN
}

type Finding {
  id: ID!
  category: FindingCategory!
  severity: Int!
  estimatedCost: Float!
  notes: String
}

enum Priority {
  LOW
  MEDIUM
  HIGH
}

type RepairPlan {
  id: ID!
  priority: Priority!
  totalEstimatedCost: Float!
  createdAt: String!
}

type Query {
  turbines(page: Int, limit: Int, nameContains: String): TurbineConnection!
  turbine(id: ID!): Turbine
  inspection(id: ID!): Inspection
  repairPlan(inspectionId: ID!): RepairPlan
}

type Mutation {
  createTurbine(input: TurbineCreateInput!): Turbine!
  updateTurbine(id: ID!, input: TurbineUpdateInput!): Turbine!
  deleteTurbine(id: ID!): Boolean!
  generateRepairPlan(inspectionId: ID!): RepairPlan!
}
