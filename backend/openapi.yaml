openapi: 3.0.3
info:
  title: TurbineOps Lite REST API
  version: 0.1.0
servers:
  - url: http://localhost:4000/api
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Issue JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: string
                    example: 8h
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      name: { type: string }
                      role:
                        type: string
                        enum: [ADMIN, ENGINEER, VIEWER]
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
  /turbines:
    get:
      summary: List turbines (paginated)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: name
          description: Case-insensitive substring filter on turbine name
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Paginated turbines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurbineConnection'
        '400':
          description: Invalid query parameters
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      summary: Create turbine (ENGINEER+)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurbineCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turbine'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /turbines/{id}:
    get:
      summary: Get turbine by id (VIEWER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TurbineId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turbine'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    patch:
      summary: Update turbine (ENGINEER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TurbineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurbineUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turbine'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      summary: Delete turbine (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TurbineId'
      responses:
        '204':
          description: Deleted
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409':
          description: Conflict — dependent inspections exist
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TurbineId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Turbine:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        manufacturer: { type: string, nullable: true }
        mwRating: { type: number, format: float, nullable: true }
        lat: { type: number, format: float, nullable: true }
        lng: { type: number, format: float, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TurbineCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 256 }
        manufacturer: { type: string, nullable: true, maxLength: 256 }
        mwRating: { type: number, nullable: true }
        lat: { type: number, nullable: true, minimum: -90, maximum: 90 }
        lng: { type: number, nullable: true, minimum: -180, maximum: 180 }
    TurbineUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 256 }
        manufacturer: { type: string, nullable: true, maxLength: 256 }
        mwRating: { type: number, nullable: true }
        lat: { type: number, nullable: true, minimum: -90, maximum: 90 }
        lng: { type: number, nullable: true, minimum: -180, maximum: 180 }
    TurbineConnection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Turbine'
        totalCount:
          type: integer
        page:
          type: integer
        limit:
          type: integer
