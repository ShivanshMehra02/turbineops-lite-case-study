openapi: 3.0.3
info:
  title: TurbineOps Lite REST API
  version: 0.1.0
servers:
  - url: http://localhost:4000/api
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Issue JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    type: string
                    example: Bearer
                  expiresIn:
                    type: string
                    example: 8h
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      name: { type: string }
                      role:
                        type: string
                        enum: [ADMIN, ENGINEER, VIEWER]
        '400':
          description: Validation error
        '401':
          description: Invalid credentials
  /turbines:
    get:
      summary: List turbines (paginated)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: name
          description: Case-insensitive substring filter on turbine name
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Paginated turbines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurbineConnection'
        '400':
          description: Invalid query parameters
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      summary: Create turbine (ENGINEER+)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurbineCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turbine'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
  /turbines/{id}:
    get:
      summary: Get turbine by id (VIEWER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TurbineId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turbine'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    patch:
      summary: Update turbine (ENGINEER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TurbineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurbineUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turbine'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      summary: Delete turbine (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TurbineId'
      responses:
        '204':
          description: Deleted
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409':
          description: Conflict — dependent inspections exist
  /inspections:
    get:
      summary: List inspections (paginated, filterable)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: turbine_id
          description: Restrict to a single turbine id
          schema: { type: string }
        - in: query
          name: from
          description: Lower bound on inspection `date` (instant), inclusive
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Upper bound on inspection `date` (instant), inclusive
          schema: { type: string, format: date-time }
        - in: query
          name: data_source
          schema:
            type: string
            enum: [DRONE, MANUAL]
      responses:
        '200':
          description: Paginated inspections (includes nested turbine)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionConnection'
        '400':
          description: Invalid query parameters
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      summary: Create inspection (ENGINEER+). Same turbine cannot have two inspections on the same UTC calendar day.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionCreateRest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionWithTurbine'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Turbine not found }
        '409':
          description: Overlap conflict — code INSPECTION_OVERLAP
  /inspections/{id}:
    get:
      summary: Get inspection by id including findings and repair plan (VIEWER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InspectionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionDetail'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    patch:
      summary: Update inspection (ENGINEER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InspectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionUpdateRest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionWithTurbine'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
        '409':
          description: Overlap conflict — code INSPECTION_OVERLAP
    delete:
      summary: Delete inspection (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InspectionId'
      responses:
        '204':
          description: Deleted
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
  /findings:
    get:
      summary: List findings (paginated; optional filters)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: inspection_id
          description: Restrict to findings for this inspection
          schema: { type: string }
        - in: query
          name: category
          schema:
            type: string
            enum: [BLADE_DAMAGE, LIGHTNING, EROSION, UNKNOWN]
        - in: query
          name: severity
          description: Exact severity (1–5)
          schema: { type: integer, minimum: 1, maximum: 5 }
        - in: query
          name: notes_contains
          description: Case-insensitive substring match on notes
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Paginated findings (includes parent inspection)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingConnection'
        '400': { description: Invalid query parameters }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
    post:
      summary: Create finding (ENGINEER+). BLADE_DAMAGE + notes mentioning crack require severity >= 4.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingCreateRest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingWithInspection'
        '400': { description: Validation error (including business rules) }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Inspection not found }
  /findings/{id}:
    get:
      summary: Get finding by id (VIEWER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingWithInspection'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    patch:
      summary: Update finding (ENGINEER+)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingUpdateRest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingWithInspection'
        '400': { description: Validation error }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      summary: Delete finding (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
      responses:
        '204':
          description: Deleted
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TurbineId:
      name: id
      in: path
      required: true
      schema:
        type: string
    InspectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FindingId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Turbine:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        manufacturer: { type: string, nullable: true }
        mwRating: { type: number, format: float, nullable: true }
        lat: { type: number, format: float, nullable: true }
        lng: { type: number, format: float, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TurbineCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 256 }
        manufacturer: { type: string, nullable: true, maxLength: 256 }
        mwRating: { type: number, nullable: true }
        lat: { type: number, nullable: true, minimum: -90, maximum: 90 }
        lng: { type: number, nullable: true, minimum: -180, maximum: 180 }
    TurbineUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 256 }
        manufacturer: { type: string, nullable: true, maxLength: 256 }
        mwRating: { type: number, nullable: true }
        lat: { type: number, nullable: true, minimum: -90, maximum: 90 }
        lng: { type: number, nullable: true, minimum: -180, maximum: 180 }
    TurbineConnection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Turbine'
        totalCount:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    Inspection:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date-time }
        inspectionDay: { type: string, format: date }
        inspectorName: { type: string, nullable: true }
        dataSource:
          type: string
          enum: [DRONE, MANUAL]
        rawPackageUrl: { type: string, nullable: true }
        turbineId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InspectionWithTurbine:
      allOf:
        - $ref: '#/components/schemas/Inspection'
        - type: object
          properties:
            turbine:
              $ref: '#/components/schemas/Turbine'
    InspectionDetail:
      allOf:
        - $ref: '#/components/schemas/InspectionWithTurbine'
        - type: object
          properties:
            findings:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  category:
                    type: string
                    enum: [BLADE_DAMAGE, LIGHTNING, EROSION, UNKNOWN]
                  severity: { type: integer }
                  estimatedCost: { type: number }
                  notes: { type: string, nullable: true }
            repairPlan:
              nullable: true
              type: object
              properties:
                id: { type: string }
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH]
                totalEstimatedCost: { type: number }
                createdAt: { type: string, format: date-time }
    InspectionConnection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InspectionWithTurbine'
        totalCount:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    InspectionCreateRest:
      type: object
      required: [turbine_id, date, data_source]
      properties:
        turbine_id: { type: string }
        date: { type: string, format: date-time }
        inspector_name: { type: string, nullable: true }
        data_source:
          type: string
          enum: [DRONE, MANUAL]
        raw_package_url: { type: string, nullable: true }
    InspectionUpdateRest:
      type: object
      minProperties: 1
      properties:
        turbine_id: { type: string }
        date: { type: string, format: date-time }
        inspector_name: { type: string, nullable: true }
        data_source:
          type: string
          enum: [DRONE, MANUAL]
        raw_package_url: { type: string, nullable: true }
    Finding:
      type: object
      properties:
        id: { type: string }
        inspectionId: { type: string }
        category:
          type: string
          enum: [BLADE_DAMAGE, LIGHTNING, EROSION, UNKNOWN]
        severity: { type: integer, minimum: 1, maximum: 5 }
        estimatedCost: { type: number, format: float }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FindingWithInspection:
      allOf:
        - $ref: '#/components/schemas/Finding'
        - type: object
          properties:
            inspection:
              $ref: '#/components/schemas/Inspection'
    FindingConnection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingWithInspection'
        totalCount:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    FindingCreateRest:
      type: object
      required: [inspection_id, category, severity, estimated_cost]
      properties:
        inspection_id: { type: string }
        category:
          type: string
          enum: [BLADE_DAMAGE, LIGHTNING, EROSION, UNKNOWN]
        severity: { type: integer, minimum: 1, maximum: 5 }
        estimated_cost: { type: number, minimum: 0 }
        notes: { type: string, nullable: true }
    FindingUpdateRest:
      type: object
      minProperties: 1
      properties:
        category:
          type: string
          enum: [BLADE_DAMAGE, LIGHTNING, EROSION, UNKNOWN]
        severity: { type: integer, minimum: 1, maximum: 5 }
        estimated_cost: { type: number, minimum: 0 }
        notes: { type: string, nullable: true }
